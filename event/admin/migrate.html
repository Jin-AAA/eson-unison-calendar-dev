<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eson Event Legacy Migration</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}
    .wrap{max-width:620px;margin:60px auto;padding:24px}
    .card{background:#fff;border:1px solid #dce4ef;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(20,40,80,.08)}
    h1{font-size:24px;margin:0 0 8px}
    p{line-height:1.6;color:#667085}
    label{font-size:14px;font-weight:700;display:block;margin-top:18px}
    input{width:100%;padding:13px 14px;margin-top:7px;border:1px solid #cfd8e6;border-radius:10px;font-size:16px}
    button{width:100%;margin-top:20px;border:0;border-radius:10px;background:#3b88df;color:white;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    pre{white-space:pre-wrap;background:#f6f8fb;padding:14px;border-radius:10px;margin-top:18px;min-height:58px}
    .warn{background:#fff8e8;border:1px solid #f1d992;padding:12px 14px;border-radius:10px;color:#795c12;margin-top:16px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ESON Event Legacy Migration</h1>
    <p>一次性工具：把目前 Google Sheet 的 Test Event 與 3 筆既有報名資料搬入 Firestore。</p>
    <div class="warn">執行成功後請把這個 migrate.html 從 GitHub 刪除。重複執行預設不會再次遷移。</div>

    <label>Owner Email</label>
    <input id="email" type="email" autocomplete="username">

    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="run">登入並開始遷移</button>
    <pre id="status">尚未開始</pre>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script>
const c=window.ESON_FIREBASE_CONFIG;
firebase.initializeApp(c.firebase);
const auth=firebase.auth();
const functions=firebase.app().functions(c.functionsRegion||'asia-east1');

const btn=document.querySelector('#run');
const status=document.querySelector('#status');

btn.onclick=async()=>{
  const email=document.querySelector('#email').value.trim();
  const password=document.querySelector('#password').value;
  btn.disabled=true;
  status.textContent='正在登入 Owner 帳號…';

  try{
    await auth.signInWithEmailAndPassword(email,password);
    status.textContent='登入成功，正在遷移資料…';

    const migrate=functions.httpsCallable('migrateLegacyEventData');
    const result=await migrate({});

    status.textContent=
      '完成！\n\n'+JSON.stringify(result.data,null,2)+
      '\n\n請回 Firebase Firestore 確認 events、publicEvents 與 registrations。';
  }catch(err){
    status.textContent='失敗：'+(err.message||String(err));
    btn.disabled=false;
  }
};
</script>
</body>
</html>
